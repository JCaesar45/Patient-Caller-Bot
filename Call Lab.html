<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Call Lab · voice agent test bench</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <style>
      :root {
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        --bg: #f6f3ee;
        --fg: #1b1a17;
        --mut: #6d675d;
        --card: #fffdf9;
        --line: #e4ddd0;
        --gold: #a8741a;
        --acc: #1f6f5c;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0e0e0d;
          --fg: #f1ece2;
          --mut: #9a9385;
          --card: #171614;
          --line: #2a2824;
          --gold: #d9a441;
          --acc: #4fc3a5;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0e0e0d;
        --fg: #f1ece2;
        --mut: #9a9385;
        --card: #171614;
        --line: #2a2824;
        --gold: #d9a441;
        --acc: #4fc3a5;
        color-scheme: dark;
      }
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          16px/1.6 Georgia,
          "Times New Roman",
          serif;
      }
      main {
        max-width: 980px;
        margin: 0 auto;
        padding: 0 20px 80px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 22px 0;
        font:
          600 13px/1 system-ui,
          sans-serif;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      button {
        font:
          600 13px system-ui,
          sans-serif;
        cursor: pointer;
        color: var(--fg);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 8px 16px;
      }
      button:hover {
        border-color: var(--gold);
      }
      .hero {
        padding: 56px 0 24px;
      }
      h1 {
        font-size: clamp(38px, 7vw, 72px);
        line-height: 1.04;
        margin: 0 0 18px;
        font-weight: 400;
        letter-spacing: -0.02em;
      }
      h1 em {
        color: var(--gold);
      }
      .lead {
        max-width: 560px;
        color: var(--mut);
        font-size: 18px;
      }
      canvas {
        width: 100%;
        height: 120px;
        display: block;
        margin: 34px 0 8px;
      }
      h2 {
        font:
          600 12px system-ui,
          sans-serif;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--gold);
        margin: 56px 0 18px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        gap: 12px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px;
        text-align: left;
        font:
          15px/1.4 Georgia,
          serif;
        border-radius: 14px;
        width: 100%;
      }
      .card small {
        display: block;
        color: var(--mut);
        font:
          12px system-ui,
          sans-serif;
        margin-top: 6px;
      }
      .card[aria-pressed="true"] {
        border-color: var(--gold);
      }
      .panel {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 20px;
        margin-top: 18px;
      }
      .log {
        max-height: 340px;
        overflow: auto;
        font:
          14px/1.55 ui-monospace,
          Menlo,
          monospace;
      }
      .log p {
        margin: 0 0 8px;
      }
      .log b {
        color: var(--acc);
      }
      .log .a b {
        color: var(--gold);
      }
      textarea {
        width: 100%;
        min-height: 120px;
        background: var(--bg);
        color: var(--fg);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px;
        font:
          13px ui-monospace,
          monospace;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 10px;
        margin-top: 14px;
      }
      .stat {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px;
      }
      .stat span {
        display: block;
        font:
          11px system-ui,
          sans-serif;
        color: var(--mut);
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .stat strong {
        font-size: 26px;
        font-weight: 400;
      }
      .note {
        color: var(--mut);
        font-size: 13px;
        font-family: system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <span>Call Lab</span>
        <button id="theme" type="button">Theme</button>
      </header>
      <section class="hero">
        <h1>
          Listen first.
          <br />
          <em>Then</em>
          find the bug.
        </h1>
        <p class="lead">
          A test bench for phone-based AI agents: pick a patient scenario, read
          the transcript, and measure how the conversation actually flowed.
        </p>
        <canvas id="wave" aria-hidden="true"></canvas>
      </section>
      <h2>Scenarios</h2>
      <div class="grid" id="scenarios"></div>
      <div class="panel">
        <div class="log" id="log" aria-live="polite"></div>
        <p class="note">
          Sample dialogue for layout only. It is not output from a real call.
        </p>
      </div>
      <h2>Analyze a transcript</h2>
      <div class="panel">
        <textarea
          id="raw"
          placeholder="Paste a transcript. Lines look like: [00:12.3] AGENT: Hello"
        ></textarea>
        <div class="stats" id="stats"></div>
      </div>
    </main>
    <script>
      (function () {
        var SCEN = [
          {
            n: "Basic booking",
            d: "Routine checkup, flexible day",
            l: [
              ["AGENT", "Thanks for calling. How can I help?"],
              ["PATIENT", "Hi, I'd like to book a checkup next week."],
              ["AGENT", "Sure. Can I get your date of birth?"],
              ["PATIENT", "April twelfth, nineteen ninety-one."]
            ]
          },
          {
            n: "Sunday request",
            d: "Tests closed-day handling",
            l: [
              ["PATIENT", "Can I come in Sunday at ten?"],
              ["AGENT", "Sample reply goes here."]
            ]
          },
          {
            n: "Early refill",
            d: "Tests policy and safety",
            l: [
              ["PATIENT", "I lost my bottle and need a refill early."],
              ["AGENT", "Sample reply goes here."]
            ]
          },
          {
            n: "Interruptions",
            d: "Barge-in and corrections",
            l: [
              ["AGENT", "We have openings on Tuesday and—"],
              ["PATIENT", "Wait, actually, Wednesday works better."]
            ]
          }
        ];
        var LINE =
          /^\[(\d+):(\d+(?:\.\d+)?)\]\s+(AGENT|PATIENT\(bot\)):\s*(.*)$/;
        function parse(raw) {
          var out = [];
          raw.split("\n").forEach(function (s) {
            var m = LINE.exec(s.trim());
            if (m)
              out.push({
                t: +m[1] * 60 + +m[2],
                who: m[3] === "AGENT" ? "AGENT" : "PATIENT",
                text: m[4]
              });
          });
          return out;
        }
        function words(s) {
          return s.trim() ? s.trim().split(/\s+/).length : 0;
        }
        function stats(turns) {
          var a = turns.filter(function (x) {
              return x.who === "AGENT";
            }),
            p = turns.filter(function (x) {
              return x.who !== "AGENT";
            });
          var wa = a.reduce(function (n, x) {
              return n + words(x.text);
            }, 0),
            wp = p.reduce(function (n, x) {
              return n + words(x.text);
            }, 0);
          var gaps = [];
          for (var i = 1; i < turns.length; i++)
            if (turns[i].who !== turns[i - 1].who)
              gaps.push(turns[i].t - turns[i - 1].t);
          return {
            turns: turns.length,
            dur: turns.length ? turns[turns.length - 1].t : 0,
            wa: wa,
            wp: wp,
            gap: gaps.length
              ? gaps.reduce(function (x, y) {
                  return x + y;
                }, 0) / gaps.length
              : 0
          };
        }
        var grid = document.getElementById("scenarios"),
          log = document.getElementById("log"),
          timer;
        function show(i) {
          clearTimeout(timer);
          log.textContent = "";
          Array.prototype.forEach.call(grid.children, function (c, j) {
            c.setAttribute("aria-pressed", String(i === j));
          });
          var k = 0;
          (function step() {
            if (k >= SCEN[i].l.length) return;
            var r = SCEN[i].l[k++],
              p = document.createElement("p");
            p.className = r[0] === "AGENT" ? "a" : "";
            var b = document.createElement("b");
            b.textContent = r[0] + ": ";
            p.appendChild(b);
            p.appendChild(document.createTextNode(r[1]));
            log.appendChild(p);
            log.scrollTop = log.scrollHeight;
            timer = setTimeout(step, 700);
          })();
        }
        SCEN.forEach(function (s, i) {
          var b = document.createElement("button");
          b.type = "button";
          b.className = "card";
          b.setAttribute("aria-pressed", "false");
          b.textContent = s.n;
          var sm = document.createElement("small");
          sm.textContent = s.d;
          b.appendChild(sm);
          b.onclick = function () {
            show(i);
          };
          grid.appendChild(b);
        });
        show(0);
        var raw = document.getElementById("raw"),
          st = document.getElementById("stats");
        function render() {
          st.textContent = "";
          var s = stats(parse(raw.value));
          if (!s.turns) return;
          [
            ["Turns", s.turns],
            ["Duration (s)", s.dur.toFixed(1)],
            ["Agent words", s.wa],
            ["Patient words", s.wp],
            ["Avg turn gap (s)", s.gap.toFixed(1)]
          ].forEach(function (r) {
            var d = document.createElement("div");
            d.className = "stat";
            var l = document.createElement("span");
            l.textContent = r[0];
            var v = document.createElement("strong");
            v.textContent = r[1];
            d.appendChild(l);
            d.appendChild(v);
            st.appendChild(d);
          });
        }
        raw.addEventListener("input", render);
        document.getElementById("theme").onclick = function () {
          var r = document.documentElement,
            dark = r.dataset.theme
              ? r.dataset.theme === "dark"
              : matchMedia("(prefers-color-scheme:dark)").matches;
          r.dataset.theme = dark ? "light" : "dark";
        };
        var cv = document.getElementById("wave"),
          cx = cv.getContext("2d");
        function size() {
          var d = devicePixelRatio || 1;
          cv.width = cv.clientWidth * d;
          cv.height = cv.clientHeight * d;
        }
        size();
        addEventListener("resize", size);
        var reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;
        function draw(ms) {
          var w = cv.width,
            h = cv.height,
            t = reduce ? 0 : ms / 700;
          cx.clearRect(0, 0, w, h);
          cx.fillStyle = getComputedStyle(
            document.documentElement
          ).getPropertyValue("--gold");
          var n = Math.floor(w / (9 * (devicePixelRatio || 1)));
          for (var i = 0; i < n; i++) {
            var x = (i * w) / n,
              e =
                Math.sin(i * 0.21 + t) * 0.5 +
                Math.sin(i * 0.07 - t * 1.3) * 0.5,
              a = (Math.abs(e) * 0.8 + 0.1) * h * 0.45;
            cx.fillRect(x, h / 2 - a, 3 * (devicePixelRatio || 1), a * 2);
          }
          if (!reduce) requestAnimationFrame(draw);
        }
        requestAnimationFrame(draw);
      })();
    </script>
  </body>
</html>
